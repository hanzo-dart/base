name: publish

# Publishes to pub.dev via OIDC when a version tag is pushed.
# Requires the package to have this repo configured as an automated
# publisher on pub.dev. Dormant until the first tag.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  publish:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart pub publish --force
